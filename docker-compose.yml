services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d automation"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      # Lets scripts/email-backup.mjs (run inside this container) read the
      # dump that scripts/backup-db.sh (run on the host) just wrote.
      - /opt/backups/solid-creaciones:/app/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
