name: Desplegar en el VPS

# Se ejecuta solo cuando se sube algo a esta rama. Cuando fusionéis este
# trabajo a una rama principal (main), cambiad el nombre de abajo.
on:
  push:
    branches:
      - claude/serene-knuth-tzdail
  # También se puede lanzar a mano desde la pestaña "Actions" de GitHub.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cargar la clave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Confiar en la huella del VPS
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Actualizar y reconstruir en el VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/SOLID-CREACIONES
            git fetch origin
            git reset --hard origin/claude/serene-knuth-tzdail
            docker compose up -d --build
            docker image prune -f
          '
